<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mouse and Cheese</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="mouse-cheese-icon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background-color: #8B4513;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        main {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #FFFACD;
            font-size: 1.4em;
            margin: 0 0 10px 0;
        }
        #game canvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <main>
        <h1>Drag the Mouse to the Cheese!</h1>
        <div id="game"></div>
    </main>

    <script>
        // Game dimensions
        let TILE_SIZE = 80; // Will be calculated based on screen size
        let GAME_WIDTH = 320;
        let GAME_HEIGHT = 480;

        // Game state
        let gameMouse = { x: 0, y: 0 };  // Mouse (character) position
        let cheeseX, cheeseY;         // Cheese position (bottom-right)
        let traps = [];               // Array of {x, y, radius}
        let isDragging = false;
        let gameState = 'playing';    // 'playing', 'won', 'lost'
        let shakeTimer = 0;           // For shake effect on lose

        // Collision constants (will be scaled)
        let MOUSE_COLLISION_RADIUS = 25;
        let TRAP_RADIUS = 40;
        let MIN_GAP = 60;

        // Confetti particles
        let confetti = [];

        // Path corridor for trap generation
        let pathCorridor = [];

        function setup() {
            // Calculate game size based on screen size (mobile-friendly)
            let maxWidth = min(windowWidth - 20, 400);
            let maxHeight = windowHeight - 100;

            // Keep aspect ratio roughly 2:3
            if (maxWidth * 1.5 > maxHeight) {
                GAME_HEIGHT = maxHeight;
                GAME_WIDTH = floor(maxHeight / 1.5);
            } else {
                GAME_WIDTH = maxWidth;
                GAME_HEIGHT = floor(maxWidth * 1.5);
            }

            // Calculate scale factor
            TILE_SIZE = GAME_WIDTH / 4;

            // Scale collision radii
            let scale = TILE_SIZE / 80;
            MOUSE_COLLISION_RADIUS = 25 * scale;
            TRAP_RADIUS = 40 * scale;
            MIN_GAP = 60 * scale;

            let canvas = createCanvas(GAME_WIDTH, GAME_HEIGHT);
            canvas.parent('game');
            textAlign(CENTER, CENTER);

            initGame();
        }

        function initGame() {
            // Mouse starts at top-left
            gameMouse.x = TILE_SIZE * 0.8;
            gameMouse.y = TILE_SIZE * 0.8;

            // Cheese at bottom-right
            cheeseX = GAME_WIDTH - TILE_SIZE * 0.8;
            cheeseY = GAME_HEIGHT - TILE_SIZE * 0.8;

            // Generate path and traps
            generatePathAndTraps();

            gameState = 'playing';
            isDragging = false;
            shakeTimer = 0;
            confetti = [];
        }

        // Path-first trap generation
        function generatePathAndTraps() {
            traps = [];
            pathCorridor = [];

            // Choose path type: 0 = diagonal, 1 = L-shaped, 2 = S-curved
            let pathType = floor(random(3));
            let pathWidth = MOUSE_COLLISION_RADIUS * 3;

            if (pathType === 0) {
                // Diagonal path
                pathCorridor.push({
                    x1: gameMouse.x - pathWidth,
                    y1: gameMouse.y - pathWidth,
                    x2: cheeseX + pathWidth,
                    y2: cheeseY + pathWidth,
                    type: 'diagonal'
                });
            } else if (pathType === 1) {
                // L-shaped path (go right then down, or down then right)
                if (random() < 0.5) {
                    // Right then down
                    let cornerX = cheeseX;
                    let cornerY = gameMouse.y;
                    pathCorridor.push({
                        x1: gameMouse.x - pathWidth, y1: gameMouse.y - pathWidth,
                        x2: cornerX + pathWidth, y2: gameMouse.y + pathWidth,
                        type: 'horizontal'
                    });
                    pathCorridor.push({
                        x1: cornerX - pathWidth, y1: gameMouse.y - pathWidth,
                        x2: cornerX + pathWidth, y2: cheeseY + pathWidth,
                        type: 'vertical'
                    });
                } else {
                    // Down then right
                    let cornerX = gameMouse.x;
                    let cornerY = cheeseY;
                    pathCorridor.push({
                        x1: gameMouse.x - pathWidth, y1: gameMouse.y - pathWidth,
                        x2: gameMouse.x + pathWidth, y2: cornerY + pathWidth,
                        type: 'vertical'
                    });
                    pathCorridor.push({
                        x1: gameMouse.x - pathWidth, y1: cornerY - pathWidth,
                        x2: cheeseX + pathWidth, y2: cornerY + pathWidth,
                        type: 'horizontal'
                    });
                }
            } else {
                // S-curved path
                let midY = (gameMouse.y + cheeseY) / 2;
                let midX1 = GAME_WIDTH * 0.7;
                let midX2 = GAME_WIDTH * 0.3;

                pathCorridor.push({
                    x1: gameMouse.x - pathWidth, y1: gameMouse.y - pathWidth,
                    x2: midX1 + pathWidth, y2: midY,
                    type: 'diagonal'
                });
                pathCorridor.push({
                    x1: midX2 - pathWidth, y1: midY,
                    x2: cheeseX + pathWidth, y2: cheeseY + pathWidth,
                    type: 'diagonal'
                });
                // Middle connection
                pathCorridor.push({
                    x1: midX2 - pathWidth, y1: midY - pathWidth,
                    x2: midX1 + pathWidth, y2: midY + pathWidth,
                    type: 'horizontal'
                });
            }

            // Place 4-6 traps in non-path zones (minimum 1)
            let numTraps = floor(random(4, 7));
            let attempts = 0;
            let maxAttempts = 200;

            while ((traps.length < numTraps && attempts < maxAttempts) || (traps.length < 1 && attempts < maxAttempts * 2)) {
                attempts++;

                // Random position with margins
                let tx = random(TRAP_RADIUS * 1.5, GAME_WIDTH - TRAP_RADIUS * 1.5);
                let ty = random(TRAP_RADIUS * 1.5, GAME_HEIGHT - TRAP_RADIUS * 1.5);

                // Check if position is in path corridor
                if (isInPathCorridor(tx, ty, TRAP_RADIUS + MOUSE_COLLISION_RADIUS + 10)) {
                    continue;
                }

                // Check if too close to mouse start
                if (dist(tx, ty, gameMouse.x, gameMouse.y) < TRAP_RADIUS * 3) {
                    continue;
                }

                // Check if too close to cheese
                if (dist(tx, ty, cheeseX, cheeseY) < TRAP_RADIUS * 3) {
                    continue;
                }

                // Check if overlapping other traps
                let overlapping = false;
                for (let trap of traps) {
                    if (dist(tx, ty, trap.x, trap.y) < TRAP_RADIUS * 2.5) {
                        overlapping = true;
                        break;
                    }
                }

                if (!overlapping) {
                    traps.push({ x: tx, y: ty, radius: TRAP_RADIUS });
                }
            }

            // Guarantee at least one trap by relaxing constraints if needed
            if (traps.length < 1) {
                // Find a position that's at least away from start and end
                for (let i = 0; i < 50; i++) {
                    let tx = random(TRAP_RADIUS * 2, GAME_WIDTH - TRAP_RADIUS * 2);
                    let ty = random(GAME_HEIGHT * 0.3, GAME_HEIGHT * 0.7); // Middle area

                    if (dist(tx, ty, gameMouse.x, gameMouse.y) > TRAP_RADIUS * 2 &&
                        dist(tx, ty, cheeseX, cheeseY) > TRAP_RADIUS * 2) {
                        traps.push({ x: tx, y: ty, radius: TRAP_RADIUS });
                        break;
                    }
                }
            }
        }

        function isInPathCorridor(px, py, margin) {
            for (let corridor of pathCorridor) {
                if (corridor.type === 'diagonal') {
                    // Check distance to diagonal line
                    let x1 = corridor.x1, y1 = corridor.y1;
                    let x2 = corridor.x2, y2 = corridor.y2;

                    // Expanded bounding box check
                    let minX = min(x1, x2) - margin;
                    let maxX = max(x1, x2) + margin;
                    let minY = min(y1, y2) - margin;
                    let maxY = max(y1, y2) + margin;

                    if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
                        // Point-to-line distance
                        let A = py - y1;
                        let B = x2 - x1;
                        let C = px - x1;
                        let D = y2 - y1;
                        let dot = A * B - C * D;
                        let lenSq = B * B + D * D;
                        let dist = abs(dot) / sqrt(lenSq);

                        if (dist < (abs(x2 - x1) + abs(y2 - y1)) / 4 + margin) {
                            return true;
                        }
                    }
                } else {
                    // Rectangle check for horizontal/vertical corridors
                    let minX = min(corridor.x1, corridor.x2) - margin;
                    let maxX = max(corridor.x1, corridor.x2) + margin;
                    let minY = min(corridor.y1, corridor.y2) - margin;
                    let maxY = max(corridor.y1, corridor.y2) + margin;

                    if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
                        return true;
                    }
                }
            }
            return false;
        }

        function draw() {
            // Shake effect when losing
            let shakeX = 0, shakeY = 0;
            if (shakeTimer > 0) {
                shakeX = random(-8, 8);
                shakeY = random(-8, 8);
                shakeTimer--;
            }

            push();
            translate(shakeX, shakeY);

            // Wood floor background
            background('#DEB887');

            // Draw wood grain pattern
            stroke('#C4A574');
            strokeWeight(1);
            for (let y = 0; y < GAME_HEIGHT; y += 20) {
                let xOff = (y / 20) % 2 * 30;
                for (let x = -30 + xOff; x < GAME_WIDTH + 30; x += 60) {
                    line(x, y, x + 50, y);
                }
            }

            // Draw cheese
            drawCheese(cheeseX, cheeseY);

            // Draw traps with danger zones
            for (let trap of traps) {
                drawTrap(trap.x, trap.y, trap.radius);
            }

            // Draw collision circle while dragging
            if (isDragging && gameState === 'playing') {
                drawCollisionCircle(gameMouse.x, gameMouse.y, MOUSE_COLLISION_RADIUS);
            }

            // Draw mouse character
            drawMouse(gameMouse.x, gameMouse.y, frameCount);

            pop();

            // Game state overlays
            if (gameState === 'won') {
                updateConfetti();
                drawConfetti();

                // Semi-transparent overlay
                fill(0, 0, 0, 100);
                rect(0, 0, width, height);

                // Bouncy win text
                let bounce = sin(frameCount * 0.1) * 10;
                let fontSize = min(width * 0.2, 60);

                fill('#FFD700');
                stroke('#FF8C00');
                strokeWeight(4);
                textSize(fontSize + sin(frameCount * 0.15) * 3);
                text('YUM!', width/2, height/2 - 20 + bounce);

                textSize(fontSize * 0.4);
                fill('#FFFFFF');
                noStroke();
                text('Tap to play again', width/2, height/2 + fontSize * 0.6);
            } else if (gameState === 'lost') {
                // Semi-transparent overlay
                fill(0, 0, 0, 120);
                rect(0, 0, width, height);

                // Ouch text
                let bounce = sin(frameCount * 0.15) * 5;
                let fontSize = min(width * 0.2, 60);

                fill('#FF4444');
                stroke('#880000');
                strokeWeight(4);
                textSize(fontSize + sin(frameCount * 0.2) * 2);
                text('OUCH!', width/2, height/2 - 20 + bounce);

                textSize(fontSize * 0.4);
                fill('#FFFFFF');
                noStroke();
                text('Tap to try again', width/2, height/2 + fontSize * 0.6);
            }
        }

        function drawMouse(x, y, time) {
            let s = TILE_SIZE / 100;

            // Wiggle animation - mouse is nervous/excited
            let wiggleX = sin(time * 0.15) * 2 * s;
            let wiggleY = cos(time * 0.12) * 2 * s;
            let earWiggle = sin(time * 0.2) * 3 * s;
            x += wiggleX;
            y += wiggleY;

            // Tail with extra wiggle
            let tailWiggle = sin(time * 0.25) * 20 * s;
            stroke('#808080');
            strokeWeight(4 * s);
            noFill();
            bezier(x + 20 * s, y + 15 * s,
                   x + 40 * s + tailWiggle, y + 30 * s,
                   x + 50 * s + tailWiggle * 0.5, y + 10 * s,
                   x + 45 * s, y - 5 * s);

            // Body
            fill('#808080');
            stroke('#505050');
            strokeWeight(3 * s);
            ellipse(x, y + 5 * s, 50 * s, 40 * s);

            // Head
            fill('#808080');
            ellipse(x, y - 15 * s, 40 * s, 35 * s);

            // Ears with wiggle
            fill('#FFB6C1');
            stroke('#FF8080');
            strokeWeight(2 * s);
            ellipse(x - 18 * s, y - 30 * s + earWiggle, 25 * s, 25 * s);
            ellipse(x + 18 * s, y - 30 * s - earWiggle, 25 * s, 25 * s);

            // Eyes - looking around nervously
            let lookX = sin(time * 0.05) * 2 * s;
            fill('#FFFFFF');
            stroke('#000');
            strokeWeight(1 * s);
            ellipse(x - 10 * s, y - 18 * s, 14 * s, 16 * s);
            ellipse(x + 10 * s, y - 18 * s, 14 * s, 16 * s);

            // Pupils follow a pattern
            fill('#000');
            noStroke();
            ellipse(x - 10 * s + lookX, y - 18 * s, 6 * s, 8 * s);
            ellipse(x + 10 * s + lookX, y - 18 * s, 6 * s, 8 * s);

            // Nose twitching
            let noseTwitch = sin(time * 0.3) * 1 * s;
            fill('#FFB6C1');
            ellipse(x, y - 5 * s + noseTwitch, 10 * s, 8 * s);

            // Whiskers with twitch
            let whiskerTwitch = sin(time * 0.2) * 3 * s;
            stroke('#000');
            strokeWeight(1 * s);
            line(x - 20 * s, y - 8 * s, x - 35 * s, y - 12 * s + whiskerTwitch);
            line(x - 20 * s, y - 5 * s, x - 35 * s, y - 5 * s + whiskerTwitch);
            line(x + 20 * s, y - 8 * s, x + 35 * s, y - 12 * s - whiskerTwitch);
            line(x + 20 * s, y - 5 * s, x + 35 * s, y - 5 * s - whiskerTwitch);
        }

        function drawCheese(x, y) {
            let s = TILE_SIZE / 80;

            // Slight wobble animation
            let wobble = sin(frameCount * 0.08) * 2 * s;
            y += wobble;

            // Main cheese wedge
            fill('#FFD700');
            stroke('#DAA520');
            strokeWeight(3 * s);

            // Draw wedge shape
            beginShape();
            vertex(x - 35 * s, y + 25 * s);
            vertex(x + 35 * s, y + 25 * s);
            vertex(x + 25 * s, y - 30 * s);
            vertex(x - 25 * s, y - 20 * s);
            endShape(CLOSE);

            // Top surface (lighter)
            fill('#FFEC8B');
            beginShape();
            vertex(x - 25 * s, y - 20 * s);
            vertex(x + 25 * s, y - 30 * s);
            vertex(x + 15 * s, y - 35 * s);
            vertex(x - 15 * s, y - 25 * s);
            endShape(CLOSE);

            // Cheese holes
            fill('#DAA520');
            noStroke();
            ellipse(x - 10 * s, y + 5 * s, 15 * s, 12 * s);
            ellipse(x + 15 * s, y + 10 * s, 12 * s, 10 * s);
            ellipse(x + 5 * s, y - 10 * s, 10 * s, 8 * s);
            ellipse(x - 15 * s, y + 18 * s, 8 * s, 6 * s);
        }

        function drawTrap(x, y, radius) {
            let s = TILE_SIZE / 80;

            // Danger zone circle (red, semi-transparent)
            fill(255, 0, 0, 40);
            stroke('#FF0000');
            strokeWeight(2);
            ellipse(x, y, radius * 2, radius * 2);

            // Trap base (wooden)
            fill('#8B4513');
            stroke('#5D2E0C');
            strokeWeight(2 * s);
            rectMode(CENTER);
            rect(x, y, 40 * s, 25 * s, 3 * s);

            // Metal snap bar
            fill('#808080');
            stroke('#404040');
            strokeWeight(1 * s);

            // Spring mechanism
            arc(x, y - 5 * s, 20 * s, 20 * s, PI, TWO_PI);

            // Snap bar
            rect(x, y - 12 * s, 35 * s, 4 * s);

            // Trigger plate
            fill('#CD853F');
            noStroke();
            ellipse(x, y + 5 * s, 12 * s, 8 * s);

            rectMode(CORNER);
        }

        function drawCollisionCircle(x, y, radius) {
            // Semi-transparent blue circle
            fill(65, 105, 225, 100);
            stroke(65, 105, 225, 200);
            strokeWeight(2);
            ellipse(x, y, radius * 2, radius * 2);
        }

        // Check collision with traps
        function checkTrapCollision() {
            for (let trap of traps) {
                let d = dist(gameMouse.x, gameMouse.y, trap.x, trap.y);
                if (d < MOUSE_COLLISION_RADIUS + trap.radius) {
                    return true;
                }
            }
            return false;
        }

        // Check win condition
        function checkWinCondition() {
            let d = dist(gameMouse.x, gameMouse.y, cheeseX, cheeseY);
            return d < MOUSE_COLLISION_RADIUS + TILE_SIZE * 0.4;
        }

        // Touch events (primary input for mobile)
        function touchStarted() {
            if (gameState !== 'playing') {
                initGame();
                return false;
            }

            if (touches.length > 0) {
                let tx = touches[0].x;
                let ty = touches[0].y;

                // Check if touch is near mouse (generous hit area)
                let d = dist(tx, ty, gameMouse.x, gameMouse.y);
                if (d < TILE_SIZE * 0.8) {
                    isDragging = true;
                }
            }
            return false;
        }

        function touchMoved() {
            if (isDragging && gameState === 'playing' && touches.length > 0) {
                // Update mouse position to follow finger
                gameMouse.x = constrain(touches[0].x, MOUSE_COLLISION_RADIUS, GAME_WIDTH - MOUSE_COLLISION_RADIUS);
                gameMouse.y = constrain(touches[0].y, MOUSE_COLLISION_RADIUS, GAME_HEIGHT - MOUSE_COLLISION_RADIUS);

                // Check for trap collision
                if (checkTrapCollision()) {
                    gameState = 'lost';
                    shakeTimer = 20;
                    isDragging = false;
                }

                // Check for win
                if (checkWinCondition()) {
                    gameState = 'won';
                    isDragging = false;
                    spawnConfetti();
                }
            }
            return false;
        }

        function touchEnded() {
            isDragging = false;
            return false;
        }

        // Mouse events (desktop fallback)
        function mousePressed() {
            if (gameState !== 'playing') {
                initGame();
                return false;
            }

            // Check if click is near game mouse (generous hit area)
            // p5's mouseX/mouseY are the click coordinates
            let d = dist(mouseX, mouseY, gameMouse.x, gameMouse.y);
            if (d < TILE_SIZE * 0.8) {
                isDragging = true;
            }
            return false;
        }

        function mouseDragged() {
            if (isDragging && gameState === 'playing') {
                // Update game mouse position to follow cursor
                // p5's mouseX and mouseY are cursor position during drag
                gameMouse.x = constrain(mouseX, MOUSE_COLLISION_RADIUS, GAME_WIDTH - MOUSE_COLLISION_RADIUS);
                gameMouse.y = constrain(mouseY, MOUSE_COLLISION_RADIUS, GAME_HEIGHT - MOUSE_COLLISION_RADIUS);

                // Check for trap collision
                if (checkTrapCollision()) {
                    gameState = 'lost';
                    shakeTimer = 20;
                    isDragging = false;
                }

                // Check for win
                if (checkWinCondition()) {
                    gameState = 'won';
                    isDragging = false;
                    spawnConfetti();
                }
            }
            return false;
        }

        function mouseReleased() {
            isDragging = false;
            return false;
        }

        // Confetti system
        function spawnConfetti() {
            confetti = [];
            let colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181',
                          '#AA96DA', '#FCBAD3', '#A8D8EA', '#FF9F43', '#6C5CE7'];

            let confettiSize = TILE_SIZE * 0.12;
            for (let i = 0; i < 80; i++) {
                confetti.push({
                    x: random(width),
                    y: random(-height, 0),
                    vx: random(-2, 2),
                    vy: random(2, 5),
                    size: random(confettiSize * 0.6, confettiSize),
                    color: random(colors),
                    rotation: random(TWO_PI),
                    rotationSpeed: random(-0.2, 0.2),
                    shape: floor(random(3))
                });
            }
        }

        function updateConfetti() {
            for (let c of confetti) {
                c.x += c.vx;
                c.y += c.vy;
                c.vy += 0.1;
                c.rotation += c.rotationSpeed;

                c.vx *= 0.99;
                c.vx += sin(frameCount * 0.1 + c.x) * 0.1;

                if (c.y > height + 20) {
                    c.y = random(-50, -10);
                    c.x = random(width);
                    c.vy = random(2, 4);
                }
            }
        }

        function drawConfetti() {
            for (let c of confetti) {
                push();
                translate(c.x, c.y);
                rotate(c.rotation);
                fill(c.color);
                noStroke();

                if (c.shape === 0) {
                    rectMode(CENTER);
                    rect(0, 0, c.size, c.size);
                } else if (c.shape === 1) {
                    ellipse(0, 0, c.size, c.size);
                } else {
                    drawStar(0, 0, c.size * 0.4, c.size * 0.8, 5);
                }
                pop();
            }
        }

        function drawStar(x, y, radius1, radius2, npoints) {
            let angle = TWO_PI / npoints;
            let halfAngle = angle / 2.0;
            beginShape();
            for (let a = -PI/2; a < TWO_PI - PI/2; a += angle) {
                let sx = x + cos(a) * radius2;
                let sy = y + sin(a) * radius2;
                vertex(sx, sy);
                sx = x + cos(a + halfAngle) * radius1;
                sy = y + sin(a + halfAngle) * radius1;
                vertex(sx, sy);
            }
            endShape(CLOSE);
        }

        // Handle window resize
        function windowResized() {
            let maxWidth = min(windowWidth - 20, 400);
            let maxHeight = windowHeight - 100;

            if (maxWidth * 1.5 > maxHeight) {
                GAME_HEIGHT = maxHeight;
                GAME_WIDTH = floor(maxHeight / 1.5);
            } else {
                GAME_WIDTH = maxWidth;
                GAME_HEIGHT = floor(maxWidth * 1.5);
            }

            TILE_SIZE = GAME_WIDTH / 4;

            // Rescale collision radii
            let scale = TILE_SIZE / 80;
            MOUSE_COLLISION_RADIUS = 25 * scale;
            TRAP_RADIUS = 40 * scale;
            MIN_GAP = 60 * scale;

            resizeCanvas(GAME_WIDTH, GAME_HEIGHT);

            // Reinitialize game with new dimensions
            initGame();
        }
    </script>
</body>
</html>
